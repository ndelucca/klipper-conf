# hardware.cfg - lo que describe la maquina fisica.
#
# Pines, sensores, PID, offsets del probe y geometria. Nada de esto es contrato
# con el laminador, asi que no lo valida `orca.py check`.
#
# Se despliega en modo 0444: lo gestiona el repo, no el editor de Mainsail.
#
# ESTE ARCHIVO NO PUEDE CONTENER NADA QUE KLIPPER CALIBRE SOLO.
# SAVE_CONFIG se niega a pisar un valor que venga de un [include]: aborta con
# "section 'X' option 'Y' conflicts with included value". Puede pisar lo que
# esta en printer.cfg porque de ahi lo sabe borrar, pero de un include no.
# Por eso el control/PID de los dos calentadores y el z_offset del BLTouch
# viven en printer.cfg (ver printer.cfg.example) y no aca.
#
# La malla si vive en SAVE_CONFIG sin problema: [bed_mesh default] es una
# seccion que no existe en ningun include, asi que no hay conflicto que
# resolver.
#
# This file contains pin mappings for the stock 2021 Creality Ender 3
# S1 & S1 Pro. To use this config, check the STM32 Chip on the
# Mainboard, during "make menuconfig" select accordingly either the
# STM32F103 with "28KiB bootloader" or the STM32F401 with
# "64KiB bootloader" and serial (on USART1 PA10/PA9) for both.

# For a direct serial connection, in "make menuconfig" select
# "Enable extra low-level configuration options" and  Serial
# (on USART2 PA3/PA2), which is on the 10 pin IDC cable used
# for the LCD module as follows: 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The filename
# must be changed to "firmware.bin"

# With STM32F401, you might need to put "firmware.bin" in a
# folder on the SD card called "STM32F4_UPDATE" in order to flash.

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -10
position_max: 250
position_min: -10
homing_speed: 70

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -8
position_max: 235
position_min: -8
homing_speed: 70

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 270
position_min: -4

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
gear_ratio: 42:12
rotation_distance: 26.359
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
# control / pid_Kp / pid_Ki / pid_Kd NO van aca: los mide PID_CALIBRATE y los
# escribe SAVE_CONFIG, que no puede pisar un valor que venga de un include.
# Viven en printer.cfg. Ver printer.cfg.example.
min_temp: 0
max_temp: 300 # Set to 300 for S1 Pro

[heater_bed]
heater_pin: PA7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
# Idem [extruder]: control y PID viven en printer.cfg.
min_temp: 0
max_temp: 110 # Set to 110 for S1 Pro

[heater_fan hotend_fan]
pin: PC0

[fan]
pin: PA0
# El ABS imprime con fan_max_speed 15%. Un 4020 stock arrancando desde parado
# a 15% de PWM no gira: queda energizado, zumbando y sin mover aire.
# kick_start_time lo larga a 100% medio segundo y recien ahi baja al duty
# pedido; off_below apaga limpio en vez de dejarlo trabado abajo del 10%.
kick_start_time: 0.5
off_below: 0.10

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
# x_offset / y_offset si van aca: son la posicion fisica del probe en el carro,
# no una calibracion. z_offset NO: lo mide PROBE_CALIBRATE y lo escribe
# SAVE_CONFIG, asi que vive en printer.cfg igual que los PID.
x_offset: -48
y_offset: 0

probe_with_touch_mode: true
stow_on_each_sample: false

[bed_mesh]
speed: 120
horizontal_move_z: 5
# Los dos bordes de X estan limitados por cosas distintas:
#
# DERECHA: el x_offset -48 del BLTouch. Para palpar X=200 el nozzle tiene que
# estar en X=248, y position_max es 250. Ahi se termina, y no hay medicion que
# lo pueda extender: el borde derecho de la chapa es inverificable. Por eso
# printable_area se queda en 220 en X y esos 20 mm finales van extrapolados.
#
# IZQUIERDA: nada. El probe llega hasta X=-58, asi que palpar X=5 solo exige el
# nozzle en X=53. Estaba en 20 por copiar la posicion del primer tornillo de
# nivelacion, no por una restriccion. Bajarlo a 5 son 15 mm mas de area con Z
# medido y ademas devuelve el borde izquierdo para la linea de purga.
#
# En Y el offset del probe es 0, asi que la malla podria llegar hasta donde
# llegue el carro (235). Se queda en 220 porque ahi termina el area que declara
# Creality y no hay forma segura de verificar que haya chapa mas atras: pasada
# la chapa no hay escalon que palpar, hay aire, y un probe que no dispara baja
# el nozzle hasta position_min -4, o sea 4 mm dentro de la cama. Para estirarlo
# hace falta una medicion con regla, no una con el probe.
mesh_min: 5, 0
mesh_max: 200, 220
probe_count: 6,6
algorithm: bicubic

# Sin fade, la correccion de la malla se suma al Z en TODAS las capas: una
# pieza alta reproduce la panza de la cama de punta a punta, y ademas mete
# micro-movimiento de Z en cada capa. Con esto la malla corrige entera hasta
# Z=1, se desvanece entre Z=1 y Z=10, y arriba de eso la geometria sale recta.
fade_start: 1.0
fade_end: 10.0

# Ancla de la malla: el punto cuya correccion se define como cero. Tiene que
# ser donde se calibro el z_offset del probe. Sin esto, Klipper usa el promedio
# de la malla como referencia y el z_offset queda corrido si la cama cambia.
zero_reference_position: 110, 110

# ---------------------------------------------------------------------------
# ACELEROMETRO PARA INPUT SHAPER - PREPARADO, NO ACTIVO
# ---------------------------------------------------------------------------
# Placa ADXL345 con interfaz USB (tipicamente un RP2040 con el sensor a bordo).
# Se presenta como un MCU aparte, NO como [mcu rpi]: no hay que levantar el
# host MCU en la Pi ni cablear los GPIO, y al ser un cable corto y blindado
# evita el ruido que arruina las mediciones por SPI largo.
#
# ATENCION, el detalle que rompe todo: mientras estas secciones esten activas
# y la placa NO este enchufada, Klipper no arranca ("mcu 'adxl': Unable to
# connect"). El acelerometro se usa una vez y se guarda. Asi que el flujo es:
# descomentar -> calibrar -> volver a comentar -> los valores quedan en
# [input_shaper] de limits.cfg.
#
# El serial exacto sale de:  ls /dev/serial/by-id/
# Los pines exactos salen de la doc de TU placa: varian entre modelos. Lo de
# abajo es el pinout de las placas RP2040 tipo "Portable Input Shaper".
# Verifica tambien que el sensor sea ADXL345 y no LIS2DW, que usa otra seccion.
#
# [mcu adxl]
# serial: /dev/serial/by-id/usb-Klipper_rp2040_XXXXXXXXXXXX-if00
#
# [adxl345]
# cs_pin: adxl:gpio1
# spi_software_sclk_pin: adxl:gpio2
# spi_software_mosi_pin: adxl:gpio3
# spi_software_miso_pin: adxl:gpio0
# # axes_map depende de como quede orientada la placa al atornillarla.
# # Se verifica con ACCELEROMETER_QUERY: en reposo, un eje tiene que marcar
# # ~9800 mm/s2 (la gravedad) y los otros dos ~0.
# axes_map: x,y,z
#
# [resonance_tester]
# accel_chip: adxl345
# probe_points: 110, 110, 20

[safe_z_home]
home_xy_position: 158, 110
speed: 90
z_hop: 10
z_hop_speed: 5

[filament_switch_sensor e0_sensor]
switch_pin: !PC15
# Sin runout_gcode a proposito: con pause_on_runout la pausa la hace Klipper
# solo. El `runout_gcode: PAUSE` que habia aca corria DESPUES de esa pausa, o
# sea que pausaba algo ya pausado y contestaba "Print already paused" en la
# consola. Inofensivo, pero hacia dudar de si el sensor estaba bien puesto.
pause_on_runout: true

[pause_resume]
recover_velocity: 25

[bed_screws]
screw1: 20, 29
screw2: 195, 29
screw3: 195, 198
screw4: 20, 198

# Beeper. Es hardware, aunque el macro m300 que lo usa viva en macros.cfg.
# M300 : Play tone. Beeper support, as commonly found on usual LCD.
#   M300 [P<ms>] [S<Hz>]
#   P is the tone duration, S the tone frequency.
# The frequency won't be pitch perfect.
[output_pin PB13]
pin: PB13
#pin: PC6
#pin: PB5
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001
scale: 1
