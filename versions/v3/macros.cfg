# macros.cfg - los macros que llama el laminador.
#
# START_PRINT y END_PRINT son contrato con OrcaSlicer: sus parametros tienen que
# coincidir con machine_start_gcode / machine_end_gcode en orca/orcakit/profiles.py.
# `python orca/orca.py check` valida esa correspondencia.
#
# Se despliega en modo 0444: lo gestiona el repo, no el editor de Mainsail.

[gcode_macro M0]
description: Pausa la maquina similar al M0 de Marlin
# Antes esto terminaba con `G1 E-50`, o sea que ademas de pausar DESCARGABA el
# filamento entero, y nunca lo reponia: un RESUME despues de M0 imprimia aire
# hasta que el filamento volviera a llegar al nozzle. Encima los 50 mm caian
# justo en el max_extrude_only_distance default de Klipper, o sea al filo de
# que el movimiento fuera rechazado.
#
# Eso no es una pausa, es una descarga. Vive abajo, en DESCARGAR_FILAMENTO,
# que es lo que el codigo realmente hacia y ahora se llama como corresponde.
#
# Este macro TAMPOCO retrae por su cuenta, y eso es un arreglo, no un olvido.
# Habia un `G1 E-5` aca con el comentario "la repone el RESUME". Era falso:
# RESUME repone la retraccion que hizo PAUSE (1 mm, de mainsail.cfg), no una
# que se le sumo despues. Y el RESTORE_GCODE_STATE del final tampoco la
# deshace: con MOVE=0, que es el default, reescribe la posicion logica de E
# sin mover el motor, y en modo relativo (M83) eso es puro bookkeeping. El
# filamento se quedaba 5 mm atras para siempre, asi que los primeros
# milimetros despues de reanudar salian huecos.
#
# La retraccion de pausa la hace PAUSE y la repone RESUME, simetricamente. Lo
# unico que aporta este macro es sacar el carro del camino para cambiar rollo.
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M0_state
    PAUSE
    G91
    G1 Z{Z} F600
    G90
    G1 X{X} Y{Y} F3000
    RESTORE_GCODE_STATE NAME=M0_state


[gcode_macro DESCARGAR_FILAMENTO]
description: Retrae el filamento fuera del extrusor para cambiar de rollo
# El nozzle tiene que estar caliente: sin fundir, tirar del filamento raya el
# engranaje del Sprite. Por eso calienta a 200 si esta frio.
#
# La descarga va en dos tramos y no en uno de 50: max_extrude_only_distance
# default de Klipper es 50 mm, asi que un solo movimiento de 50 esta al filo
# de ser rechazado. Dos de 30 pasan con margen y ademas dan tiempo a que el
# hilo se despegue del bowden.
gcode:
    {% if printer.extruder.temperature < 180 %}
      M104 S200
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM=195
    {% endif %}
    SAVE_GCODE_STATE NAME=unload_state
    M83
    G1 E5 F300    ; empujar un poco primero: forma un bulbo y despega mejor
    G1 E-30 F1200
    G1 E-30 F1800
    RESTORE_GCODE_STATE NAME=unload_state

# M300 : Play tone. Beeper support, as commonly found on usual LCD.
#   M300 [P<ms>] [S<Hz>]
#   P is the tone duration, S the tone frequency.
# El pin PB13 se define en hardware.cfg, que es donde va el hardware.
[gcode_macro m300]
gcode:
  {% set S = params.S|default(1000)|int %} ; S sets the tone frequency
  {% set P = params.P|default(100)|int %} ; P sets the tone duration
  {% set L = 0.5 %} ; L varies the PWM on time, close to 0 or 1 the tone gets a bit quieter. 0.5 is a symmetric waveform
  {% if S <= 0 %} ; dont divide through zero
  {% set F = 1 %}
  {% set L = 0 %}
  {% elif S >= 10000 %} ;max frequency set to 10kHz
  {% set F = 0 %}
  {% else %}
  {% set F = 1/S %} ;convert frequency to seconds
  {% endif %}
  SET_PIN PIN=PB13 VALUE={L} CYCLE_TIME={F} ;Play tone
  G4 P{P} ;tone duration
  SET_PIN PIN=PB13 VALUE=0


# Calibracion de PID. Son DOS macros y ninguno guarda, a proposito.
#
# El primer intento fue un solo macro con las dos calibraciones y un
# SAVE_CONFIG al final. No funciona: PID_CALIBRATE es una rutina larga y
# bloqueante, y lo que va despues de ella dentro del mismo macro no se ejecuta.
# En la practica corrio la del hotend, dejo los valores pendientes en memoria y
# se quedo ahi, sin hacer la cama ni guardar nada.
#
# Por eso cada macro tiene UNA sola calibracion y nada detras. El SAVE_CONFIG lo
# corres vos, que ademas es mejor: te deja ver los Kp/Ki/Kd antes de
# comprometerlos, y si el tune salio raro (pasa con una corriente de aire
# durante la medicion) descartarlo es simplemente reiniciar sin guardar.
#
# Por que importa calibrarlos: los valores que trae hardware.cfg son los del
# config de fabrica de Klipper para esta placa, no medidos en esta maquina. Un
# PID desajustado oscila 2-3 grados alrededor del target, y esa oscilacion se
# traduce en variacion de viscosidad -> variacion de caudal -> bandas en la
# pared. Klipper tiene UN PID por calentador, no uno por material, asi que los
# targets por defecto son los del PLA, que es el material de todos los dias.
#
# El resultado NO queda en este archivo: SAVE_CONFIG lo escribe en el bloque del
# final de printer.cfg. Es el mismo trato que reciben el z_offset del probe y la
# malla: son calibraciones de una maquina fisica concreta.
#
# Ojo con una regla de Klipper que importa aca: SAVE_CONFIG se niega a pisar un
# valor que venga de un [include] y aborta con "conflicts with included value".
# Por eso las semillas de control/pid_* viven en printer.cfg y NO en
# hardware.cfg. Si alguien las vuelve a poner en un include, estos dos macros
# siguen midiendo bien pero el SAVE_CONFIG posterior falla, y mientras haya un
# valor pendiente falla para todo: tampoco vas a poder guardar la malla.
#
# Uso. Cada uno avisa con un pitido cuando termino y hay algo para guardar:
#
#   CALIBRAR_PID_NOZZLE     ~5 min    -> pitido -> SAVE_CONFIG -> M107
#   CALIBRAR_PID_CAMA      ~10 min    -> pitido -> SAVE_CONFIG
#
# La cama tarda mas que el hotend: mucha mas masa termica y un calentador
# relativamente mas flojo. Los dos aceptan TARGET= si queres otro punto, por
# ejemplo CALIBRAR_PID_CAMA TARGET=100 para centrarlo en ABS.

[gcode_macro CALIBRAR_PID_NOZZLE]
description: PID del hotend con el ventilador a full. Al terminar: SAVE_CONFIG
# El M106 va ANTES de la calibracion, que es lo unico que se puede poner en este
# macro. Calibra el peor caso termico: el ventilador soplandole al bloque, que
# es la condicion real de una pared exterior de PLA. Sin eso el PID queda
# ajustado para un hotend que nadie esta enfriando.
#
# El ventilador queda prendido al terminar. Apagalo con M107 cuando guardes.
#
# ESTA ES UNA ELECCION, NO UN OLVIDO: el PID que sale de aca esta sintonizado
# contra una perturbacion fuerte, o sea con ganancia alta. El ABS imprime con
# el ventilador entre 0 y 15% (y las primeras tres capas con 0), asi que ese
# mismo lazo sobreactua y puede dar overshoot de varios grados justo en las
# capas que deciden si la pieza se pega. Klipper tiene UN PID por calentador,
# no uno por material, y el material de todos los dias es el PLA.
#
# Si el ABS muestra ese overshoot, la medicion para ese caso es:
#   M106 S38                        (15% de duty, el del perfil de ABS)
#   CALIBRAR_PID_NOZZLE TARGET=255
# y hay que elegir cual de los dos juegos se guarda: no pueden coexistir.
gcode:
  {% set T = params.TARGET|default(215)|int %}
  _ARMAR_AVISO_PID
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET={T}


[gcode_macro CALIBRAR_PID_CAMA]
description: PID de la cama. Al terminar suena el aviso; despues: SAVE_CONFIG
gcode:
  {% set T = params.TARGET|default(60)|int %}
  _ARMAR_AVISO_PID
  PID_CALIBRATE HEATER=heater_bed TARGET={T}


# ---------------------------------------------------------------------------
# El aviso de "ya podes guardar".
#
# No puede vivir dentro del macro de calibracion: nada de lo que va despues de
# PID_CALIBRATE se ejecuta. Por eso es un vigia que corre por afuera.
#
# Lo arma el macro ANTES de largar la calibracion (eso si se ejecuta), y desde
# ahi se despierta cada 5 segundos preguntando dos cosas:
#   - hay algo pendiente de guardar?      configfile.save_config_pending
#   - la maquina dejo de estar ocupada?   idle_timeout.state
# Las dos juntas significan que la calibracion termino y dejo un resultado.
#
# El contador es para que no quede dando vueltas para siempre si la calibracion
# se aborta: 360 intentos x 5 s = 30 minutos, de sobra para la cama, que es la
# mas lenta.
[gcode_macro _AVISO_PID_ESTADO]
variable_intentos: 0
gcode:

[gcode_macro _ARMAR_AVISO_PID]
gcode:
  SET_GCODE_VARIABLE MACRO=_AVISO_PID_ESTADO VARIABLE=intentos VALUE=360
  UPDATE_DELAYED_GCODE ID=AVISO_PID DURATION=10

[delayed_gcode AVISO_PID]
gcode:
  {% set st = printer["gcode_macro _AVISO_PID_ESTADO"] %}
  {% if printer.configfile.save_config_pending
        and printer.idle_timeout.state != "Printing" %}
    { action_respond_info(
        "PID terminado. Revisa los valores arriba y corre SAVE_CONFIG para "
        "guardarlos (reinicia la impresora). Si no te convencen, reinicia sin "
        "guardar y se descartan.") }
    m300 S1200 P150
    m300 S1800 P350
  {% elif st.intentos > 0 %}
    SET_GCODE_VARIABLE MACRO=_AVISO_PID_ESTADO VARIABLE=intentos VALUE={st.intentos - 1}
    UPDATE_DELAYED_GCODE ID=AVISO_PID DURATION=5
  {% else %}
    { action_respond_info(
        "AVISO_PID: se agoto la espera sin nada pendiente de guardar. "
        "La calibracion no llego a terminar.") }
  {% endif %}


# ---------------------------------------------------------------------------
# Calibracion del extrusor: rotation_distance del Sprite.
#
# Es la constante que traduce vueltas de motor en milimetros de filamento, y
# hoy vale 26.359, que es el numero del config generico de Klipper para esta
# placa: nunca se midio en ESTA maquina.
#
# Por que importa mas de lo que parece: del lado del laminador,
# filament_flow_ratio esta en 0.98 para PLA y ABS y 0.95 para PETG. Tres de
# cuatro por debajo de 1 sugiere un sesgo comun, o sea un error del engranaje
# -que es una constante de la MAQUINA- corregido cuatro veces por separado en
# una clave de MATERIAL. Y toda la Fase B de calibracion (Max Flowrate, Flow
# Rate) mide encima de esto: si esta mal, esas dos torres miden bien un numero
# equivocado.
#
# USO:
#   1. Cargar filamento y dejar el extrusor accesible.
#   2. MARCAR EL FILAMENTO A 120 mm de la entrada del extrusor, con calibre.
#      Este paso va ANTES de correr el macro.
#   3. CALIBRAR_EXTRUSOR         (tarda ~100 s: 100 mm a 1 mm/s)
#   4. Medir lo que queda entre la marca y la entrada: son R mm.
#      Consumido real = 120 - R
#      nuevo rotation_distance = 26.359 * (120 - R) / 100
#   5. Editar rotation_distance en [extruder] de hardware.cfg y repetir.
#
#   CRITERIO: consumir 100 +/- 0.5 mm.
#
# Va en hardware.cfg y NO en printer.cfg: es geometria de la maquina, no algo
# que Klipper calibre y escriba solo, asi que no cae bajo la regla de
# SAVE_CONFIG y no hay conflicto de includes que evitar.
#
# 1 mm/s a proposito: a esa velocidad el engranaje no tiene que vencer presion
# en el fundido, asi que no patina. Un caudal alto mide el patinaje, no la
# geometria.
#
# Y en cuatro tramos de 25 y no en uno de 100 por la misma regla que documenta
# DESCARGAR_FILAMENTO: max_extrude_only_distance default de Klipper es 50 mm y
# se aplica por movimiento. Cuatro seguidos son continuos en la practica.
[gcode_macro CALIBRAR_EXTRUSOR]
description: Extruye 100 mm a 1 mm/s. MARCA el filamento a 120 mm ANTES de correr
gcode:
  {% set T = params.TARGET|default(215)|int %}
  {% if printer.extruder.temperature < T - 5 %}
    { action_respond_info("Calentando el nozzle a " ~ T ~ " grados.") }
    M104 S{T}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={T - 5}
  {% endif %}
  { action_respond_info(
      "Extruyendo 100 mm a 1 mm/s. Tarda 100 s. No toques el filamento.") }
  SAVE_GCODE_STATE NAME=cal_extrusor
  M83
  G1 E25 F60
  G1 E25 F60
  G1 E25 F60
  G1 E25 F60
  RESTORE_GCODE_STATE NAME=cal_extrusor
  m300 S1200 P150
  m300 S1800 P350
  { action_respond_info(
      "Listo. Medi lo que queda hasta la marca (R mm). Consumido = 120 - R. "
      "Nuevo rotation_distance = "
      ~ printer.configfile.settings.extruder.rotation_distance
      ~ " * (120 - R) / 100. Criterio: consumir 100 +/- 0.5 mm.") }


[gcode_macro START_PRINT]
# Pressure advance por material. Estos valores son el piso: los pone la maquina,
# asi que cualquier gcode los hereda, venga del laminador que venga.
# Son espejo de la clave pressure_advance de cada filamento en
# orca/orcakit/profiles.py, y orca.py check valida que coincidan.
#
# Un filamento de Orca con enable_pressure_advance = 1 emite su propio
# SET_PRESSURE_ADVANCE despues de este macro y por lo tanto lo pisa. Eso es
# deliberado: sirve para experimentar sin tocar el firmware.
variable_pa: {'PLA': 0.04, 'PETG': 0.06, 'ABS': 0.05, 'TPU': 0.6}
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  {% set MATERIAL = params.MATERIAL|default('PLA')|upper %}
  ; Altura de la primera capa, que el laminador anuncia. La purga del final se
  ; imprime a ESTA altura y no a un 0.28 fijo: la linea existe para juzgar la
  ; primera capa, y a 0.28 salia redondeada aunque el z_offset estuviera 0.05
  ; alto. Daba una lectura optimista justo de lo que existe para diagnosticar.
  {% set LAYER = params.LAYER|default(0.2)|float %}
  ; Espera despues de que M190 vuelve, antes del re-home en caliente. Ver el
  ; bloque del soak mas abajo.
  {% set SOAK = params.SOAK|default(90)|int %}

  G90 ; use absolute coordinates
  M83 ; extruder relative mode

  ; Higiene de arranque: el ventilador puede haber quedado soplando de una
  ; impresion cancelada, y el estado de pausa puede haber sobrevivido a una que
  ; murio pausada. Ninguna de las dos cosas se limpia sola.
  M107
  CLEAR_PAUSE

  ; Los factores de velocidad y flujo de Mainsail tampoco se limpian solos:
  ; sobreviven de una impresion a la siguiente. Si tocaste el slider al 130%
  ; para salvar una pieza, la que mandes despues sale al 130% sin que nada lo
  ; diga en ningun lado. Es la causa clasica de "esta salio rara y no se por
  ; que", y es invisible porque el gcode del laminador es identico.
  M220 S100 ; factor de velocidad
  M221 S100 ; factor de flujo

  ; El z_offset efectivo arranca siempre desde el del config, no desde el
  ; babystep que haya quedado de la impresion anterior. Si un babystep resulta
  ; bueno, se promueve con Z_OFFSET_APPLY_PROBE + SAVE_CONFIG, que es donde
  ; tiene que vivir: en el z_offset del probe, no en un ajuste volatil.
  SET_GCODE_OFFSET Z=0

  M104 S150 ; set temporary nozzle temp to prevent oozing during homing
  M140 S{BED_TEMP} ; set final bed temp

  ; Esperar por temperatura y no por reloj. El G4 S30 que habia aca era una
  ; espera fija: de mas si el nozzle venia caliente, y potencialmente de menos
  ; si venia frio. Ojo que M109 S150 NO sirve para esto: Klipper espera a que
  ; la temperatura converja al target desde cualquier lado, asi que con el
  ; nozzle a 210 se quedaria esperando a que BAJE. MINIMUM solo espera calor.
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM=150

  G28 ; home all axis and restore leveling
  ; F600 = 10 mm/s = max_z_velocity. Estuvo en F240 (4 mm/s), que era el techo
  ; viejo de 5 mm/s: subir estos 40 mm tardaba 10 s en vez de 4.
  G1 Z50 F600
  G1 X8.0 Y10 F3000

  ; LA CAMA PRIMERO, SOLA. El M104 al valor final estaba ACA ARRIBA, antes del
  ; M190, y eso dejaba el nozzle a 215 (o a 255 en ABS) chorreando durante toda
  ; la subida de la cama: 2-3 minutos a 60 grados, 6-10 a 100. Se pagaba en el
  ; bulbo que la purga tiene que barrer, en el goteo sobre la chapa, y en
  ; minutos de PETG o ABS cocinandose en la zona de fusion.
  ;
  ; Y no se ganaba tiempo: la cama SIEMPRE tarda mas que el nozzle, asi que
  ; adelantar el M104 ahorraba los ~30 s que tarda el bloque en subir de 150 a
  ; 215. Durante toda la espera el nozzle se queda en los 150 del
  ; precalentamiento, que es justo para lo que existe ese 150.
  M190 S{BED_TEMP} ; wait for bed temp to stabilize

  ; SOAK. M190 vuelve cuando el TERMISTOR toca el target, y ese termistor esta
  ; pegado abajo de la chapa: es el mismo motivo por el que el procedimiento de
  ; BED_MESH_CALIBRATE exige esperar antes de palpar. Sin esta espera, el
  ; G28 Z de abajo referencia el Z sobre una cama a mitad de camino y despues
  ; carga una malla que SI se midio en equilibrio: las dos referencias no
  ; corresponden al mismo estado termico del aluminio.
  ;
  ; 90 s es el default y cubre PLA y PETG. El ABS quiere bastante mas: se pasa
  ; SOAK por parametro desde el laminador si hace falta.
  {% if SOAK > 0 %}
    { action_respond_info(
        "Soak de cama: " ~ SOAK ~ " s a " ~ BED_TEMP|int ~ " grados") }
    G4 P{SOAK * 1000}
  {% endif %}

  M104 S{EXTRUDER_TEMP} ; set final nozzle temp
  M109 S{EXTRUDER_TEMP} ; wait for nozzle temp to stabilize

  ; Re-home de Z EN CALIENTE. El G28 de arriba referencia el Z con la cama a
  ; temperatura ambiente y el nozzle a 150; para cuando se imprime la primera
  ; capa la cama subio hasta 100 grados y el bloque otros 60, y todo eso dilata
  ; unas decimas. Es la causa clasica de que el z_offset sirva para PLA y no
  ; para ABS. Ocho segundos aca compran una primera capa reproducible.
  ;
  ; Cae en el mismo punto que zero_reference_position de [bed_mesh] (110,110,
  ; en coordenadas de probe), asi que la referencia del Z y el ancla de la
  ; malla son fisicamente el mismo lugar.
  G28 Z

  ; La malla es de la maquina, no del laminador: se carga aca y no en el start
  ; gcode de Orca. Va despues de esperar la cama para que ya este dilatada.
  ;
  ; UNA MALLA POR TEMPERATURA. Aluminio con PEI encima cambia de forma decenas
  ; de micras entre 20 y 60 grados, y otro tanto entre 60 y 100. Una sola malla
  ; medida a 60 es la del PLA; el PETG (70) y sobre todo el ABS (100) imprimian
  ; sobre una cama que no es la que palpo el probe.
  ;
  ; Los perfiles se llaman [bed_mesh pla] / [bed_mesh petg] / [bed_mesh abs].
  ; Son secciones que no existen en ningun include, asi que caen bajo la misma
  ; excepcion que [bed_mesh default] y SAVE_CONFIG las escribe sin conflicto.
  ; Se calibran una vez cada una, con la cama a su temperatura y soakeada:
  ;
  ;   M140 S60  -> esperar 10 min -> BED_MESH_CALIBRATE PROFILE=pla  -> SAVE_CONFIG
  ;   M140 S70  -> esperar 10 min -> BED_MESH_CALIBRATE PROFILE=petg -> SAVE_CONFIG
  ;   M140 S100 -> esperar 15 min -> BED_MESH_CALIBRATE PROFILE=abs  -> SAVE_CONFIG
  ;
  ; El fallback a 'default' no es prolijidad: mientras los perfiles nuevos no
  ; esten calibrados, un LOAD a secas de un perfil inexistente aborta la
  ; impresion. Asi la maquina sigue imprimiendo con lo que tiene y avisa que
  ; falta calibrar, en vez de rechazar el trabajo.
  {% set MESH = 'abs' if BED_TEMP >= 90 else 'petg' if BED_TEMP >= 65 else 'pla' %}
  {% set guardadas = printer.bed_mesh.profiles %}
  {% if MESH in guardadas %}
    BED_MESH_PROFILE LOAD={MESH}
  {% elif 'default' in guardadas %}
    { action_respond_info(
        "No hay malla '" ~ MESH ~ "': uso 'default'. Para calibrarla, cama a "
        ~ BED_TEMP|int ~ " grados, esperar 10 min y "
        "BED_MESH_CALIBRATE PROFILE=" ~ MESH ~ " + SAVE_CONFIG.") }
    BED_MESH_PROFILE LOAD=default
  {% else %}
    { action_raise_error(
        "No hay ninguna malla guardada. Corre BED_MESH_CALIBRATE PROFILE="
        ~ MESH ~ " y SAVE_CONFIG antes de imprimir.") }
  {% endif %}

  ; Pressure advance del material que anuncio el laminador.
  SET_PRESSURE_ADVANCE ADVANCE={printer["gcode_macro START_PRINT"].pa.get(MATERIAL, 0.04)}

  ; REPOSICIONAR ANTES DE BAJAR. El `G1 X8.0 Y10` de mas arriba sirve durante
  ; el calentamiento, pero el G28 Z posterior lo pisa: safe_z_home manda el
  ; carro a home_xy_position (158,110) para palpar y NO vuelve solo
  ; (move_to_previous es false por defecto). Sin estas dos lineas, el G1 Z0.28
  ; bajaba en el medio de la cama y la primera linea de purga cruzaba la placa
  ; en diagonal, 136 mm, con el nozzle apoyado y extruyendo.
  ;
  ; El Z10 es explicito a proposito: safe_z_home ya deja el carro a z_hop, pero
  ; eso es una consecuencia de su implementacion, no un contrato. Si algun dia
  ; cambia z_hop, este traslado no tiene que enterarse.
  G1 Z10 F600
  G1 X8.0 Y10 F3000

  ; Purga en X=8. Estuvo en X=2 (fuera de la malla, sobre Z extrapolado: la
  ; linea que existe para juzgar la primera capa era justo donde menos se
  ; sabia) y despues en X=25, que resolvia eso pero se comia 25 mm del borde
  ; izquierdo de la bandeja. Con mesh_min bajado a X=5 no hay que elegir: en
  ; X=8 la purga cae sobre dato medido Y sobre el borde.
  ;
  ; La altura es la de la PRIMERA CAPA del proceso, que llega por parametro.
  ; Estuvo fija en 0.28 mientras los procesos imprimian a 0.20 (0.25 en Draft):
  ; un 40% mas alta que la capa que la linea existe para diagnosticar.
  G1 Z{LAYER} F240
  G92 E0
  G1 X8.0 Y140 E10 F1500 ; prime the nozzle
  G1 X8.3 Y140 F5000
  G92 E0
  G1 X8.3 Y10 E10 F1200 ; prime the nozzle
  G92 E0

[gcode_macro END_PRINT]
gcode:
  G91 ; relative positioning
  G1 E-2 F2700 ; retract a bit
  G1 E-2 Z0.2 F2400 ; retract and raise Z
  G1 X5 Y5 F3000 ; wipe out
  G1 Z10 ; raise Z more
  G90 ; absolute positioning
  G1 X0 Y220 ; present print
  M106 S0 ; turn off fan
  M104 S0 ; turn off hotend
  M140 S0 ; turn off bed
  M84 ; disable motors
