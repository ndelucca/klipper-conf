# macros.cfg - los macros que llama el laminador.
#
# START_PRINT y END_PRINT son contrato con OrcaSlicer: sus parametros tienen que
# coincidir con machine_start_gcode / machine_end_gcode en orca/src/profiles.py.
# `python orca/orca.py check` valida esa correspondencia.
#
# Se despliega en modo 0444: lo gestiona el repo, no el editor de Mainsail.

[gcode_macro M0]
description: Pausa la maquina similar al M0 de Marlin
# Antes esto terminaba con `G1 E-50`, o sea que ademas de pausar DESCARGABA el
# filamento entero, y nunca lo reponia: un RESUME despues de M0 imprimia aire
# hasta que el filamento volviera a llegar al nozzle. Encima los 50 mm caian
# justo en el max_extrude_only_distance default de Klipper, o sea al filo de
# que el movimiento fuera rechazado.
#
# Eso no es una pausa, es una descarga. Vive abajo, en DESCARGAR_FILAMENTO,
# que es lo que el codigo realmente hacia y ahora se llama como corresponde.
# Aca queda la retraccion corta que si tiene sentido en una pausa: lo justo
# para que no chorree mientras la maquina espera.
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M0_state
    PAUSE
    G91
    G1 E-5 F2700 ; retraccion de pausa, la repone el RESUME
    G1 Z{Z} F600
    G90
    G1 X{X} Y{Y} F3000
    RESTORE_GCODE_STATE NAME=M0_state


[gcode_macro DESCARGAR_FILAMENTO]
description: Retrae el filamento fuera del extrusor para cambiar de rollo
# El nozzle tiene que estar caliente: sin fundir, tirar del filamento raya el
# engranaje del Sprite. Por eso calienta a 200 si esta frio.
#
# La descarga va en dos tramos y no en uno de 50: max_extrude_only_distance
# default de Klipper es 50 mm, asi que un solo movimiento de 50 esta al filo
# de ser rechazado. Dos de 30 pasan con margen y ademas dan tiempo a que el
# hilo se despegue del bowden.
gcode:
    {% if printer.extruder.temperature < 180 %}
      M104 S200
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM=195
    {% endif %}
    SAVE_GCODE_STATE NAME=unload_state
    M83
    G1 E5 F300    ; empujar un poco primero: forma un bulbo y despega mejor
    G1 E-30 F1200
    G1 E-30 F1800
    RESTORE_GCODE_STATE NAME=unload_state

# M300 : Play tone. Beeper support, as commonly found on usual LCD.
#   M300 [P<ms>] [S<Hz>]
#   P is the tone duration, S the tone frequency.
# El pin PB13 se define en hardware.cfg, que es donde va el hardware.
[gcode_macro m300]
gcode:
  {% set S = params.S|default(1000)|int %} ; S sets the tone frequency
  {% set P = params.P|default(100)|int %} ; P sets the tone duration
  {% set L = 0.5 %} ; L varies the PWM on time, close to 0 or 1 the tone gets a bit quieter. 0.5 is a symmetric waveform
  {% if S <= 0 %} ; dont divide through zero
  {% set F = 1 %}
  {% set L = 0 %}
  {% elif S >= 10000 %} ;max frequency set to 10kHz
  {% set F = 0 %}
  {% else %}
  {% set F = 1/S %} ;convert frequency to seconds
  {% endif %}
  SET_PIN PIN=PB13 VALUE={L} CYCLE_TIME={F} ;Play tone
  G4 P{P} ;tone duration
  SET_PIN PIN=PB13 VALUE=0


# Calibracion de PID. Son DOS macros y ninguno guarda, a proposito.
#
# El primer intento fue un solo macro con las dos calibraciones y un
# SAVE_CONFIG al final. No funciona: PID_CALIBRATE es una rutina larga y
# bloqueante, y lo que va despues de ella dentro del mismo macro no se ejecuta.
# En la practica corrio la del hotend, dejo los valores pendientes en memoria y
# se quedo ahi, sin hacer la cama ni guardar nada.
#
# Por eso cada macro tiene UNA sola calibracion y nada detras. El SAVE_CONFIG lo
# corres vos, que ademas es mejor: te deja ver los Kp/Ki/Kd antes de
# comprometerlos, y si el tune salio raro (pasa con una corriente de aire
# durante la medicion) descartarlo es simplemente reiniciar sin guardar.
#
# Por que importa calibrarlos: los valores que trae hardware.cfg son los del
# config de fabrica de Klipper para esta placa, no medidos en esta maquina. Un
# PID desajustado oscila 2-3 grados alrededor del target, y esa oscilacion se
# traduce en variacion de viscosidad -> variacion de caudal -> bandas en la
# pared. Klipper tiene UN PID por calentador, no uno por material, asi que los
# targets por defecto son los del PLA, que es el material de todos los dias.
#
# El resultado NO queda en este archivo: SAVE_CONFIG lo escribe en el bloque del
# final de printer.cfg. Es el mismo trato que reciben el z_offset del probe y la
# malla: son calibraciones de una maquina fisica concreta.
#
# Ojo con una regla de Klipper que importa aca: SAVE_CONFIG se niega a pisar un
# valor que venga de un [include] y aborta con "conflicts with included value".
# Por eso las semillas de control/pid_* viven en printer.cfg y NO en
# hardware.cfg. Si alguien las vuelve a poner en un include, estos dos macros
# siguen midiendo bien pero el SAVE_CONFIG posterior falla, y mientras haya un
# valor pendiente falla para todo: tampoco vas a poder guardar la malla.
#
# Uso. Cada uno avisa con un pitido cuando termino y hay algo para guardar:
#
#   CALIBRAR_PID_NOZZLE     ~5 min    -> pitido -> SAVE_CONFIG -> M107
#   CALIBRAR_PID_CAMA      ~10 min    -> pitido -> SAVE_CONFIG
#
# La cama tarda mas que el hotend: mucha mas masa termica y un calentador
# relativamente mas flojo. Los dos aceptan TARGET= si queres otro punto, por
# ejemplo CALIBRAR_PID_CAMA TARGET=100 para centrarlo en ABS.

[gcode_macro CALIBRAR_PID_NOZZLE]
description: PID del hotend con el ventilador a full. Al terminar: SAVE_CONFIG
# El M106 va ANTES de la calibracion, que es lo unico que se puede poner en este
# macro. Calibra el peor caso termico: el ventilador soplandole al bloque, que
# es la condicion real de una pared exterior de PLA. Sin eso el PID queda
# ajustado para un hotend que nadie esta enfriando.
#
# El ventilador queda prendido al terminar. Apagalo con M107 cuando guardes.
gcode:
  {% set T = params.TARGET|default(215)|int %}
  _ARMAR_AVISO_PID
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET={T}


[gcode_macro CALIBRAR_PID_CAMA]
description: PID de la cama. Al terminar suena el aviso; despues: SAVE_CONFIG
gcode:
  {% set T = params.TARGET|default(60)|int %}
  _ARMAR_AVISO_PID
  PID_CALIBRATE HEATER=heater_bed TARGET={T}


# ---------------------------------------------------------------------------
# El aviso de "ya podes guardar".
#
# No puede vivir dentro del macro de calibracion: nada de lo que va despues de
# PID_CALIBRATE se ejecuta. Por eso es un vigia que corre por afuera.
#
# Lo arma el macro ANTES de largar la calibracion (eso si se ejecuta), y desde
# ahi se despierta cada 5 segundos preguntando dos cosas:
#   - hay algo pendiente de guardar?      configfile.save_config_pending
#   - la maquina dejo de estar ocupada?   idle_timeout.state
# Las dos juntas significan que la calibracion termino y dejo un resultado.
#
# El contador es para que no quede dando vueltas para siempre si la calibracion
# se aborta: 360 intentos x 5 s = 30 minutos, de sobra para la cama, que es la
# mas lenta.
[gcode_macro _AVISO_PID_ESTADO]
variable_intentos: 0
gcode:

[gcode_macro _ARMAR_AVISO_PID]
gcode:
  SET_GCODE_VARIABLE MACRO=_AVISO_PID_ESTADO VARIABLE=intentos VALUE=360
  UPDATE_DELAYED_GCODE ID=AVISO_PID DURATION=10

[delayed_gcode AVISO_PID]
gcode:
  {% set st = printer["gcode_macro _AVISO_PID_ESTADO"] %}
  {% if printer.configfile.save_config_pending
        and printer.idle_timeout.state != "Printing" %}
    { action_respond_info(
        "PID terminado. Revisa los valores arriba y corre SAVE_CONFIG para "
        "guardarlos (reinicia la impresora). Si no te convencen, reinicia sin "
        "guardar y se descartan.") }
    m300 S1200 P150
    m300 S1800 P350
  {% elif st.intentos > 0 %}
    SET_GCODE_VARIABLE MACRO=_AVISO_PID_ESTADO VARIABLE=intentos VALUE={st.intentos - 1}
    UPDATE_DELAYED_GCODE ID=AVISO_PID DURATION=5
  {% else %}
    { action_respond_info(
        "AVISO_PID: se agoto la espera sin nada pendiente de guardar. "
        "La calibracion no llego a terminar.") }
  {% endif %}


[gcode_macro START_PRINT]
# Pressure advance por material. Estos valores son el piso: los pone la maquina,
# asi que cualquier gcode los hereda, venga del laminador que venga.
# Son espejo de la clave pressure_advance de cada filamento en
# orca/src/profiles.py, y orca.py check valida que coincidan.
#
# Un filamento de Orca con enable_pressure_advance = 1 emite su propio
# SET_PRESSURE_ADVANCE despues de este macro y por lo tanto lo pisa. Eso es
# deliberado: sirve para experimentar sin tocar el firmware.
variable_pa: {'PLA': 0.04, 'PETG': 0.06, 'ABS': 0.05, 'TPU': 0.6}
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  {% set MATERIAL = params.MATERIAL|default('PLA')|upper %}

  G90 ; use absolute coordinates
  M83 ; extruder relative mode

  ; Higiene de arranque: el ventilador puede haber quedado soplando de una
  ; impresion cancelada, y el estado de pausa puede haber sobrevivido a una que
  ; murio pausada. Ninguna de las dos cosas se limpia sola.
  M107
  CLEAR_PAUSE

  ; El z_offset efectivo arranca siempre desde el del config, no desde el
  ; babystep que haya quedado de la impresion anterior. Si un babystep resulta
  ; bueno, se promueve con Z_OFFSET_APPLY_PROBE + SAVE_CONFIG, que es donde
  ; tiene que vivir: en el z_offset del probe, no en un ajuste volatil.
  SET_GCODE_OFFSET Z=0

  M104 S150 ; set temporary nozzle temp to prevent oozing during homing
  M140 S{BED_TEMP} ; set final bed temp

  ; Esperar por temperatura y no por reloj. El G4 S30 que habia aca era una
  ; espera fija: de mas si el nozzle venia caliente, y potencialmente de menos
  ; si venia frio. Ojo que M109 S150 NO sirve para esto: Klipper espera a que
  ; la temperatura converja al target desde cualquier lado, asi que con el
  ; nozzle a 210 se quedaria esperando a que BAJE. MINIMUM solo espera calor.
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM=150

  G28 ; home all axis and restore leveling
  G1 Z50 F240
  G1 X25.0 Y10 F3000
  M104 S{EXTRUDER_TEMP} ; set final nozzle temp
  M190 S{BED_TEMP} ; wait for bed temp to stabilize
  M109 S{EXTRUDER_TEMP} ; wait for nozzle temp to stabilize

  ; Re-home de Z EN CALIENTE. El G28 de arriba referencia el Z con la cama a
  ; temperatura ambiente y el nozzle a 150; para cuando se imprime la primera
  ; capa la cama subio hasta 100 grados y el bloque otros 60, y todo eso dilata
  ; unas decimas. Es la causa clasica de que el z_offset sirva para PLA y no
  ; para ABS. Ocho segundos aca compran una primera capa reproducible.
  ;
  ; Cae en el mismo punto que zero_reference_position de [bed_mesh] (110,110,
  ; en coordenadas de probe), asi que la referencia del Z y el ancla de la
  ; malla son fisicamente el mismo lugar.
  G28 Z

  ; La malla es de la maquina, no del laminador: se carga aca y no en el start
  ; gcode de Orca. Va despues de esperar la cama para que ya este dilatada.
  BED_MESH_PROFILE LOAD=default

  ; Pressure advance del material que anuncio el laminador.
  SET_PRESSURE_ADVANCE ADVANCE={printer["gcode_macro START_PRINT"].pa.get(MATERIAL, 0.04)}

  ; Purga en X=25, no en X=2: mesh_min arranca en X=20, asi que en X=2 estas
  ; 130 mm de linea salian con el Z extrapolado. Ahora la purga se imprime
  ; sobre dato medido, que es justo lo que la vuelve util como testigo de la
  ; primera capa.
  G1 Z0.28 F240
  G92 E0
  G1 X25.0 Y140 E10 F1500 ; prime the nozzle
  G1 X25.3 Y140 F5000
  G92 E0
  G1 X25.3 Y10 E10 F1200 ; prime the nozzle
  G92 E0

[gcode_macro END_PRINT]
gcode:
  G91 ; relative positioning
  G1 E-2 F2700 ; retract a bit
  G1 E-2 Z0.2 F2400 ; retract and raise Z
  G1 X5 Y5 F3000 ; wipe out
  G1 Z10 ; raise Z more
  G90 ; absolute positioning
  G1 X0 Y220 ; present print
  M106 S0 ; turn off fan
  M104 S0 ; turn off hotend
  M140 S0 ; turn off bed
  M84 ; disable motors
