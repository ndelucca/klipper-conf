# limits.cfg - el contrato con el laminador.
#
# Todo lo de este archivo tiene un espejo del lado de OrcaSlicer, y
# `python orca/orca.py check` falla si los dos lados dejan de coincidir.
# Antes de tocar un valor aca, corre check despues.
#
# Se despliega en modo 0444: lo gestiona el repo, no el editor de Mainsail.

[printer]
# Espejado en orca/orcakit/profiles.py -> MACHINE machine_max_speed_* /
# machine_max_acceleration_* / machine_max_jerk_*.
kinematics: cartesian
max_velocity: 300

# max_accel es el techo MECANICO: hasta donde puede acelerar esta maquina sin
# perder pasos. NO es el presupuesto de ringing de la superficie.
#
# Estuvo en 2000 haciendo las dos cosas a la vez, y esa confusion se pagaba
# entera en el travel: el ringing de un desplazamiento por el aire no toca la
# pieza, pero quedaba capado igual por una restriccion de calidad superficial
# que no le corresponde. Con 2000, alcanzar los 250 mm/s de travel_speed exige
# 15.6 mm de recorrido, y casi ningun travel de una pieza real es tan largo:
# el 250 del perfil era, en la practica, ficcion.
#
#   distancia para llegar a 250 mm/s     a=2000 -> 15.6 mm     a=3000 -> 10.4 mm
#
# OJO con esa tabla: es v^2/2a, o sea SOLO la rampa de subida, y un travel
# tambien tiene que frenar. Ademas Klipper reserva un tramo de crucero minimo
# (ver minimum_cruise_ratio abajo). La distancia que de verdad hace falta es
# v^2 / (a * (1 - minimum_cruise_ratio)):
#
#                                     r = 0.5 (default)     r = 0
#   con a = 2000                          62.5 mm          31.2 mm
#   con a = 3000                          41.7 mm          20.8 mm
#
# Por eso los dos parametros van juntos: subir max_accel sin bajar el ratio
# deja el travel en 41.7 mm de carrera para tocar 250, que sigue siendo mas
# largo que casi cualquier desplazamiento de una pieza real.
#
# El presupuesto de ringing sigue siendo 2000, pero ahora vive donde
# corresponde: en las aceleraciones de IMPRESION de los procesos de Orca
# (default_acceleration 2000, outer_wall_acceleration 700, top_surface 700).
# Ninguna de esas se movio ni un punto. Lo unico que subio es
# travel_acceleration. `orca.py check` valida esa separacion: mira las acels
# de impresion contra el techo de ringing, y ya no este numero.
#
# 3000 y no 4000 a proposito. En Y no se mueve el carro: se mueve la cama con
# la pieza encima, y su inercia crece con lo que estes imprimiendo. Si aguanta
# sin corrimiento de capa en una pieza grande con travels largos, se puede
# probar 4000 (y ahi machine_max_acceleration_* de MACHINE tiene que seguirlo,
# o check falla).
max_accel: 3000

# La otra mitad del mismo argumento. max_accel dice cuanto se PUEDE acelerar;
# esto dice cuanto de eso se llega a usar en un movimiento corto.
#
# Klipper garantiza un tramo de crucero minimo bajando la aceleracion del
# movimiento. Con el default de 0.5, un movimiento solo acelera durante el 25%
# de su largo (25% subida + 50% crucero + 25% bajada), y la velocidad pico va
# como sqrt(a * (1-r) * D): r=0.5 cuesta exactamente lo mismo que dividir
# max_accel por dos.
#
# En 0, un segmento corto alcanza la velocidad que el perfil dice. Es la misma
# ganancia (factor sqrt(2)) que daria duplicar max_accel, y no cuesta hardware
# ni calibracion.
#
# El riesgo esta acotado: con r=0 el movimiento pasa mas fraccion de su tiempo
# acelerando, que es cuando se excita la resonancia. Pero la pared exterior y
# la superficie superior corren a 700 mm/s2 por M204 pase lo que pase con este
# numero, asi que lo que se ve no cambia de regimen: lo que se acelera es
# pared interior, relleno y travel. Si aparece eco que se transmita a la
# superficie, subir a 0.2 antes que volver al default.
minimum_cruise_ratio: 0

# El Z no es 5/100 por nada de esta maquina: eran los valores del archivo de
# ejemplo de Klipper para Ender 3. Con rotation_distance 8 (husillo TR8x8),
# 5 mm/s son 37 rpm del motor Z, la mitad de lento de lo que puede. Se paga en
# cada z-hop, cada cambio de capa, el G1 Z50 del START_PRINT y el z_hop 10 del
# safe_z_home. A 10 mm/s son 75 rpm, territorio comodo para un TR8x8.
max_z_velocity: 10
max_z_accel: 200

[gcode_arcs]
# Sin esta clave Klipper usa su default de 1.0 mm: recibe un G2/G3 y lo parte en
# cuerdas de 1 mm, lo que en un radio de 2 mm deja una sagita de 0.064 mm, bien
# visible al tacto en bordes redondeados y en agujeros chicos.
# Con 0.1 mm ese error baja a 0.0006 mm.
#
# 0.2 y no 0.1. La sagita de un segmento de largo L sobre un radio R es
# L^2/(8R), asi que el peor caso realista -un agujero de 2 mm, o sea R=1- da:
#
#   resolution     sagita en R=1     segmentos/s a 110 mm/s
#      1.0            0.125 mm             110        <- era el problema
#      0.2            0.005 mm             550
#      0.1            0.0013 mm           1100
#
# 0.0013 mm es unas 80 veces mas fino de lo que esta maquina posiciona: esos
# 1100 segmentos por segundo compraban cero calidad y los pagaba el
# planificador de Klipper, que corre en Python sobre una Pi 3B+. Y la cuenta
# va a empeorar: el planchado agrega trayectoria fina sobre cada cara
# superior, el travel a 3000 recorre los mismos arcos mas rapido, y el input
# shaper encarece bastante la generacion de pasos.
#
# Esta clave es la que habilita enable_arc_fitting = 1 en los procesos de Orca.
# Si se sube arriba de 0.2, hay que apagar el arc fitting o las curvas vuelven a
# facetarse; check valida ese par. 0.2 es justo el limite que check acepta.
resolution: 0.2

[exclude_object]
# Habilita cancelar un objeto individual desde Mainsail.
# Espejo: exclude_object = 1 y gcode_label_objects = 1 en los procesos de Orca.

[idle_timeout]
# Antes esto era `timeout: 10` con `gcode: STATUS`, un macro que no existe en
# esta maquina. El efecto real no era desactivar el timeout sino romperlo: cada
# entrada a reposo tiraba "Unknown command: STATUS" y, como el gcode default
# estaba pisado, los calentadores no se apagaban nunca.
# 3600 s da margen de sobra para preparar una impresion sin que se enfrie nada,
# y deja una red de seguridad real si una impresion se cancela.
#
# La guarda de pausa NO es prolijidad. El estado de idle_timeout de Klipper no
# distingue "ocioso" de "pausado": una impresion pausada sola por el sensor de
# filamento entra al contador igual. A la hora, el gcode de abajo apagaria los
# calentadores y -peor- haria M84, que desenergiza los motores: el carro se
# puede mover, se pierde la posicion, y el RESUME posterior no solo imprime
# sobre plastico frio, imprime en el lugar equivocado. La impresion se pierde
# entera. Y el escenario no es hipotetico: [filament_switch_sensor e0_sensor]
# tiene pause_on_runout, o sea que la maquina se pausa sola justo cuando no
# estas mirando.
timeout: 3600
gcode:
  {% if printer.pause_resume.is_paused %}
    { action_respond_info(
        "Impresion pausada: no apago nada y reprogramo el timeout.") }
    SET_IDLE_TIMEOUT TIMEOUT=3600
  {% else %}
    TURN_OFF_HEATERS
    M84
  {% endif %}

# [input_shaper]
# NO CALIBRADO. Mientras esta seccion no exista, las aceleraciones de
# IMPRESION de los procesos de Orca se quedan en el techo de ringing de 2000,
# y la pared exterior -que es lo unico que se ve- en 700.
#
# `orca.py check` valida esa relacion y falla si un proceso pide mas sin que
# el shaper este puesto. Ojo con que es lo que mira: las acels de los
# PROCESOS, no max_accel. max_accel es el techo mecanico y puede estar mas
# alto para que el travel respire (ver arriba). Eso es a proposito: subir la
# aceleracion de impresion sin shaper no acelera nada util, solo agrega
# ringing; subir la del travel si.
#
# Por que esto importa mas que cualquier otro ajuste: lo que destraba no es la
# velocidad de pared sino la DISTANCIA DE ACELERACION.
#
#                                 a = 2000        a = 4000
#   llegar a 110 mm/s (pared)       3.0 mm         1.5 mm
#   llegar a 250 mm/s (travel)     15.6 mm         7.8 mm
#
# La mayoria de los segmentos de una pieza real son mas cortos que eso: hoy
# nunca llegan a la velocidad nominal del perfil. Duplicar la aceleracion no
# mejora un 10%, mejora cada segmento corto del print.
#
# ---------------------------------------------------------------------------
# PROCEDIMIENTO CON ACELEROMETRO USB (el que corresponde a esta maquina)
# ---------------------------------------------------------------------------
# La placa ADXL345 USB y sus secciones estan preparadas y comentadas en
# hardware.cfg. Recordar que Klipper NO arranca si esas secciones estan
# activas y la placa desenchufada: se descomenta para calibrar y se vuelve a
# comentar al terminar.
#
#   1. Enchufar la placa. `ls /dev/serial/by-id/` para sacar el serial y
#      cargarlo en [mcu adxl] de hardware.cfg. Descomentar las tres secciones.
#   2. FIRMWARE_RESTART y verificar con ACCELEROMETER_QUERY: en reposo un eje
#      tiene que dar ~9800 mm/s2 y los otros dos ~0. Si no, corregir axes_map.
#   3. MEDIR X: montar el acelerometro en el CARRO (sobre el hotend).
#          SHAPER_CALIBRATE AXIS=X
#   4. MEDIR Y: montar el acelerometro en la CAMA.
#          SHAPER_CALIBRATE AXIS=Y
#
#      El paso 4 no es opcional ni una prolijidad: esta maquina es un bed
#      slinger. En Y no se mueve el carro, se mueve la cama con la pieza
#      encima. Su resonancia es otra, y ademas CAMBIA con el peso de lo que
#      se este imprimiendo. Medir Y desde el carro mide el eje equivocado.
#
#   5. SAVE_CONFIG. Klipper escribe el resultado en el bloque del final de
#      printer.cfg, que gana sobre este archivo.
#   6. Promover esos valores ACA abajo (descomentando), borrar el bloque de
#      SAVE_CONFIG, y volver a comentar las secciones de hardware.cfg.
#   7. Recien ahi subir las aceleraciones de IMPRESION de los procesos (y de
#      paso max_accel, que es el techo que las contiene), y correr
#      `orca.py build` para regenerar los presets. Los valores a mover estan
#      en la tabla de orca/docs/orcaslicer-ender3s1pro-klipper.md, seccion 8.
#
# ---------------------------------------------------------------------------
# ALTERNATIVA SIN HARDWARE (torre de ringing)
# ---------------------------------------------------------------------------
# Menos preciso (+-15%) pero gratis, y alcanza para pasar de 2000 a 3000.
#   1. En OrcaSlicer: Calibration -> Input Shaper, imprimir la torre.
#   2. Medir con calibre la separacion entre ondas, en mm.
#   3. freq = velocidad_del_test / separacion.
#   4. shaper_type mzv y esa frecuencia, para cada eje.
#
# shaper_type_x: mzv
# shaper_freq_x: ??
# shaper_type_y: mzv
# shaper_freq_y: ??
